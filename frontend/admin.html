<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы — ЭлектроМир</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { accent: '#f59e0b', dark: '#1f2937' } } },
    };
  </script>
</head>
<body class="m-0 bg-[#f6f7f9] text-[#1d2330] font-sans">

  <header class="flex justify-between items-center px-6 py-3.5 bg-dark">
    <a class="font-bold text-xl text-white no-underline" href="/">⚡ ЭлектроМир</a>
  </header>

  <main class="max-w-[1100px] mx-auto px-4 pt-6 pb-16">
    <h1 class="text-3xl font-bold mb-4">Заказы</h1>

    <form id="login" class="flex flex-col gap-2 max-w-[360px] mb-3">
      <input id="pwd" type="password" placeholder="Пароль администратора" required
             class="p-2.5 border border-gray-300 rounded-lg text-[15px]">
      <button class="bg-accent border-0 rounded-lg px-3.5 py-2.5 font-semibold cursor-pointer">Показать заказы</button>
    </form>

    <p id="msg" class="msg min-h-[20px] text-sm"></p>
    <div id="orders"></div>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
